# VLE Consulting Project Configuration
# Ethanol-Water Binary System at 1 atm

system:
  name: "Ethanol-Water"
  pressure_kPa: 101.3
  temperature_unit: "Celsius"
  
components:
  - name: "Ethanol"
    cas: "64-17-5"
    antoine:
      A: 8.20417
      B: 1642.89
      C: 230.3
      unit: "mmHg"
      
  - name: "Water"
    cas: "7732-18-5"
    antoine:
      A: 8.07131
      B: 1730.63
      C: 233.426
      unit: "mmHg"

models:
  nrtl:
    # Source: DECHEMA Chemistry Data Series / Gmehling et al. (1990)
    # Reference: Gmehling, J., Onken, U., Arlt, W., "Vapor-Liquid Equilibrium 
    #            Data Collection", DECHEMA Chemistry Data Series, Vol. I, Part 1
    # tau_ij = a_ij + b_ij / T  (T in Kelvin)
    alpha12: 0.3
    alpha21: 0.3
    a12: -0.801
    b12: 246.18    # K - produces exothermic mixing (negative H^E)
    a21: 3.458
    b21: -586.08   # K - from DECHEMA/DDB
    
  vanlaar:
    A12: 1.65
    A21: 0.95

output:
  figures_dir: "figures"
  dpi: 300
  format: "png"
