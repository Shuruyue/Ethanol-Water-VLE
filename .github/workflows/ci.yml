name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # Windows catches encoding problems Linux cannot (non-UTF-8 default console encoding)
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: pip install -r requirements.txt pytest pandas chemicals CoolProp
      - name: Course code tests (src/)
        run: pytest -q tests
      - name: Scientific verification script
        run: python tests/verify_scientific_correctness.py
      - name: Report calculation tests (report2026/)
        working-directory: report2026/calc
        run: pytest -q test_core.py
